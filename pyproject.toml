[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eeg-signal-processing-lab"
version = "0.1.0"
description = "Reproducible EEG signal-processing lab using public PhysioNet motor movement/imagery data (MNE-Python). Foundation for BCI and neurotechnology work."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "eeg-signal-processing-lab contributors" }]
keywords = [
    "eeg",
    "bci",
    "brain-computer-interface",
    "neurotechnology",
    "signal-processing",
    "mne-python",
    "neuroscience",
    "motor-imagery",
    "open-science",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

# Planned runtime dependencies. Lower bounds only (not aggressively pinned) so
# the environment stays reproducible without locking out compatible updates.
# Nothing is installed as part of the v0.1 scaffolding.
dependencies = [
    "mne>=1.6",
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "scipy>=1.10",
    "notebook>=7.0",
    "jupyter>=1.0",
]

[project.optional-dependencies]
viz = ["plotly>=5.18"]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/eeg-signal-processing-lab/eeg-signal-processing-lab"
Documentation = "https://github.com/eeg-signal-processing-lab/eeg-signal-processing-lab/tree/main/docs"
Dataset = "https://physionet.org/content/eegmmidb/1.0.0/"

[tool.hatch.build.targets.wheel]
packages = ["src/eeg_lab"]

[tool.pytest.ini_options]
# Allow running the placeholder tests without an editable install (src-layout).
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
